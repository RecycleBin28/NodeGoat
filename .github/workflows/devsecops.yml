name: DevSecOps Pipeline
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep --config=p/owasp-top-ten . --json --output=semgrep-report.json || true
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
  sca:
    name: SCA - Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'NodeGoat'
          path: '.'
          format: 'HTML'
      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [sast, sca]
    services:
      mongo:
        image: mongo:4.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the app
        run: |
          docker build -t nodegoat-test .
          docker run -d -p 4000:4000 --network="host" \
            -e MONGODB_URI="mongodb://localhost:27017/nodegoat" \
            nodegoat-test
          sleep 15

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:4000'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
